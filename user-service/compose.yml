services:
  user-service:
    build:
      context: ..
      dockerfile: user-service/Dockerfile
    command: npm run start:dev
    ports:
      - '3000:3000'
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DB_HOST=${USER_SERVICE_DB_HOST}
      - DB_PORT=${USER_SERVICE_DB_PORT}
      - DB_USERNAME=${USER_SERVICE_DB_USERNAME}
      - DB_DATABASE=${USER_SERVICE_DB_DATABASE}
      - DB_SYNCHRONIZE=${USER_SERVICE_DB_SYNCHRONIZE}
      - ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL}
      - ADMIN_BOOTSTRAP_DISPLAY_NAME=${ADMIN_BOOTSTRAP_DISPLAY_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_USERNAME=${REDIS_USERNAME}
      - REDIS_DB_INDEX=${REDIS_DB_INDEX}
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - SERVER_SECRET_FILE=/run/secrets/server_secret
      - RABBITMQ_USER=${USER_SERVICE_RABBITMQ_USER}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
      - RABBITMQ_PASSWORD_FILE=/run/secrets/rabbitmq_user_password
      - LOG_LEVEL=${LOG_LEVEL}
      - JWT_PUBLIC_KEY_FILE=/run/secrets/jwt_public_key
      - JWT_PRIVATE_KEY_FILE=/run/secrets/jwt_private_key
    secrets:
      - db_password
      - server_secret
      - rabbitmq_user_password
      - jwt_private_key
      - jwt_public_key
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - dist/
            - test/
            - docs/
            - .env
            - '*.secret'
        - action: rebuild
          path: package.json

  user-db:
    image: postgres:18-alpine
    ports:
      - '${USER_SERVICE_DB_PORT}:5432'
    environment:
      - POSTGRES_USER=${USER_SERVICE_DB_USERNAME}
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_DB=${USER_SERVICE_DB_DATABASE}
    volumes:
      - user-db-data:/var/lib/postgresql
    secrets:
      - db_password
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:latest
    ports:
      - '${REDIS_PORT}:6379'

volumes:
  user-db-data:

secrets:
  db_password:
    file: secrets/db_password.secret
  server_secret:
    file: secrets/server_secret.secret
  rabbitmq_user_password:
    file: secrets/rabbitmq_user_password.secret
  jwt_private_key:
    file: secrets/jwt_private_key.secret
  jwt_public_key:
    file: secrets/jwt_public_key.secret
