services:
  credit-service:
    build:
      context: .
      target: development
    command: npm run start:dev
    restart: unless-stopped
    ports:
      - '${CREDIT_SERVICE_HOST_PORT}:${CREDIT_SERVICE_PORT}'
    depends_on:
      credit-db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${CREDIT_SERVICE_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_HOST: ${CREDIT_SERVICE_DB_HOST}
      DB_PORT: ${CREDIT_SERVICE_DB_PORT}
      DB_USERNAME: ${CREDIT_SERVICE_DB_USERNAME}
      DB_DATABASE: ${CREDIT_SERVICE_DB_DATABASE}
      DB_PASSWORD_FILE: /run/secrets/credit_db_password
    secrets:
      - credit_db_password
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider "http://127.0.0.1:$${PORT}/"',
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - dist/
            - coverage/
            - test/
            - .env
            - secrets/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json

  credit-db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - '${CREDIT_SERVICE_DB_HOST_PORT}:5432'
    environment:
      POSTGRES_USER: ${CREDIT_SERVICE_DB_USERNAME}
      POSTGRES_DB: ${CREDIT_SERVICE_DB_DATABASE}
      POSTGRES_PASSWORD_FILE: /run/secrets/credit_db_password
    volumes:
      - credit-db-data:/var/lib/postgresql
    secrets:
      - credit_db_password
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  credit-db-data:

secrets:
  credit_db_password:
    file: ./secrets/credit_db_password.secret
