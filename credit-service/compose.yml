services:
  credit-service:
    build:
      context: .
      target: development
    command: npm run start:dev
    restart: unless-stopped
    ports:
      - '${CREDIT_SERVICE_HOST_PORT:-3003}:${PORT:-3000}'
    depends_on:
      credit-db:
        condition: service_healthy
      credit-rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      DB_HOST: ${DB_HOST:-credit-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-credit_service}
      DB_DATABASE: ${DB_DATABASE:-credit_service}
      DB_PASSWORD_FILE: /run/secrets/credit_db_password
      INITIAL_CREDIT_BALANCE: ${INITIAL_CREDIT_BALANCE:-100}
      RABBITMQ_URL: 'amqp://${RABBITMQ_USERNAME:?RABBITMQ_USERNAME must be set}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}@credit-rabbitmq:5672'
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-foc.events}
      RABBITMQ_USER_REGISTERED_QUEUE: ${RABBITMQ_USER_REGISTERED_QUEUE:-credit-service.user-registered.v1}
      RABBITMQ_USER_REGISTERED_ROUTING_KEY: ${RABBITMQ_USER_REGISTERED_ROUTING_KEY:-user.registered.v1}
      RABBITMQ_CREDIT_ACCOUNT_INITIALISED_ROUTING_KEY: ${RABBITMQ_CREDIT_ACCOUNT_INITIALISED_ROUTING_KEY:-credit.account-initialised.v1}
      RABBITMQ_RETRY_EXCHANGE: ${RABBITMQ_RETRY_EXCHANGE:-foc.credit.retry}
      RABBITMQ_DEAD_LETTER_EXCHANGE: ${RABBITMQ_DEAD_LETTER_EXCHANGE:-foc.credit.dlx}
      RABBITMQ_DEAD_LETTER_QUEUE: ${RABBITMQ_DEAD_LETTER_QUEUE:-credit-service.user-registered.v1.dlq}
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-10}
      RABBITMQ_RETRY_DELAYS_MS: ${RABBITMQ_RETRY_DELAYS_MS:-1000,2000,4000,8000,16000}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_CLAIM_LEASE_MS: ${OUTBOX_CLAIM_LEASE_MS:-30000}
      OUTBOX_UNPUBLISHED_WARNING_MS: ${OUTBOX_UNPUBLISHED_WARNING_MS:-60000}
    secrets:
      - credit_db_password
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider "http://127.0.0.1:$${PORT:-3000}/"',
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - dist/
            - coverage/
            - test/
            - .env
            - secrets/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json

  credit-db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - '${DB_HOST_PORT:-5435}:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME:-credit_service}
      POSTGRES_DB: ${DB_DATABASE:-credit_service}
      POSTGRES_PASSWORD_FILE: /run/secrets/credit_db_password
    volumes:
      - credit-db-data:/var/lib/postgresql
    secrets:
      - credit_db_password
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  credit-rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    restart: unless-stopped
    ports:
      - '${RABBITMQ_HOST_PORT:-5675}:5672'
      - '${RABBITMQ_MANAGEMENT_HOST_PORT:-15675}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
    volumes:
      - credit-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  credit-db-data:
  credit-rabbitmq-data:

secrets:
  credit_db_password:
    file: ./secrets/credit_db_password.secret
