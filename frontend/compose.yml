services:
  frontend:
    build:
      context: .
    image: ${FOC_IMAGE_PREFIX:-foc}/frontend:${FRONTEND_IMAGE_TAG:-dev}
    environment:
      - USER_SERVICE_URL=${USER_SERVICE_URL-http://user-service:3000}
      - SUPPLIER_SERVICE_URL=${SUPPLIER_SERVICE_URL-http://supplier-service:3000}
      - CREDIT_SERVICE_URL=${CREDIT_SERVICE_URL-http://credit-service:3000}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL-http://order-service:3000}
    ports:
      - '3001:3000' # 3000 is user-service
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: package.json
