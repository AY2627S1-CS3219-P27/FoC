# Opt-in host access for local debugging (Swagger, Postman straight to a
# service, psql). Not for demos or deployment:
#
#   docker compose -f compose.yaml -f compose.debug.yaml up -d --wait
#
# Everything binds to 127.0.0.1. Each debugged container also joins `ops`, so
# its debug port sits beside the other dev UIs rather than on `internal`.
# Override a host port by exporting its variable before running compose.
services:
  user-service:
    networks: [internal, ops]
    ports: ['127.0.0.1:${USER_SERVICE_HOST_PORT:-3000}:3000']
  supplier-service:
    networks: [internal, ops]
    ports: ['127.0.0.1:${SUPPLIER_SERVICE_HOST_PORT:-3002}:3000']
  credit-service:
    networks: [internal, ops]
    ports: ['127.0.0.1:${CREDIT_SERVICE_HOST_PORT:-3003}:3000']
  order-service:
    networks: [internal, ops]
    ports: ['127.0.0.1:${ORDER_SERVICE_HOST_PORT:-3004}:3000']

  user-db:
    networks: [internal, ops]
    ports: ['127.0.0.1:${USER_SERVICE_DB_HOST_PORT:-5432}:5432']
  credit-db:
    networks: [internal, ops]
    ports: ['127.0.0.1:${CREDIT_SERVICE_DB_HOST_PORT:-5435}:5432']
  order-db:
    networks: [internal, ops]
    ports: ['127.0.0.1:${ORDER_SERVICE_DB_HOST_PORT:-5436}:5432']
  supplier-db:
    networks: [internal, ops]
    ports: ['127.0.0.1:${SUPPLIER_DB_HOST_PORT:-5438}:5432']
  redis:
    networks: [internal, ops]
    ports: ['127.0.0.1:${REDIS_HOST_PORT:-6379}:6379']
