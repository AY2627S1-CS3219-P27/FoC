services:
  notification-service:
    build:
      context: ..
      dockerfile: notification-service/Dockerfile
      target: development
    image: ${FOC_IMAGE_PREFIX:-foc}/notification-service:${NOTIFICATION_SERVICE_IMAGE_TAG:-dev}
    command: npm run start:dev
    depends_on:
      notification-db:
        condition: service_healthy
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${NOTIFICATION_SERVICE_PORT:-3000}
      - LOG_LEVEL=${LOG_LEVEL}
      - DB_HOST=${NOTIFICATION_SERVICE_DB_HOST}
      - DB_PORT=${NOTIFICATION_SERVICE_DB_PORT}
      - DB_USERNAME=${NOTIFICATION_SERVICE_DB_USERNAME}
      - DB_DATABASE=${NOTIFICATION_SERVICE_DB_DATABASE}
      - DB_MIGRATIONS_RUN=${NOTIFICATION_SERVICE_DB_MIGRATIONS_RUN:-true}
      - DB_PASSWORD_FILE=/run/secrets/notification_db_password
      - RABBITMQ_USER=${NOTIFICATION_SERVICE_RABBITMQ_USER}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
      - RABBITMQ_PASSWORD_FILE=/run/secrets/rabbitmq_notification_password
      - RABBITMQ_PREFETCH=${RABBITMQ_PREFETCH:-10}
      - RABBITMQ_RETRY_DELAYS_MS=${RABBITMQ_RETRY_DELAYS_MS:-1000,2000,4000,8000,16000}
      - JWT_PUBLIC_KEY_FILE=/run/secrets/jwt_public_key_notification_service
      - VAPID_PUBLIC_KEY=${NOTIFICATION_SERVICE_VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY_FILE=/run/secrets/vapid_private_key
      - VAPID_SUBJECT=${NOTIFICATION_SERVICE_VAPID_SUBJECT:-mailto:notifications@foc.local}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://loki:3100/otlp/v1/logs}
    secrets:
      - notification_db_password
      - rabbitmq_notification_password
      - jwt_public_key_notification_service
      - vapid_private_key
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider "http://127.0.0.1:3000/health"',
        ]
      interval: 10s
      timeout: 3s
      start_period: 180s
      retries: 5
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - dist/
            - test/
            - docs/
            - .env
            - '*.secret'
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
        - action: sync+restart
          path: ../packages/observability/src
          target: /usr/src/packages/observability/src
        - action: sync+restart
          path: ../packages/observability/tsconfig.json
          target: /usr/src/packages/observability/tsconfig.json
        - action: sync+restart
          path: ../packages/observability/tsconfig.build.json
          target: /usr/src/packages/observability/tsconfig.build.json
        - action: rebuild
          path: ../packages/observability/package.json
        - action: rebuild
          path: ../packages/observability/package-lock.json

  notification-db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${NOTIFICATION_SERVICE_DB_USERNAME}
      - POSTGRES_PASSWORD_FILE=/run/secrets/notification_db_password
      - POSTGRES_DB=${NOTIFICATION_SERVICE_DB_DATABASE}
    volumes:
      - notification-db-data:/var/lib/postgresql
    secrets:
      - notification_db_password
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  notification-db-data:

secrets:
  notification_db_password:
    file: secrets/notification_db_password.secret
  rabbitmq_notification_password:
    file: secrets/rabbitmq_notification_password.secret
  # Read-only copy of user-service's verification key, exactly as the other
  # token-consuming services mount it.
  jwt_public_key_notification_service:
    file: ../user-service/secrets/jwt_public_key.secret
  # Signs Web Push requests; must match NOTIFICATION_SERVICE_VAPID_PUBLIC_KEY.
  vapid_private_key:
    file: secrets/vapid_private_key.secret
