# Local single-tenant Tempo for the dev stack. Services export OTLP/HTTP to
# tempo:4318 (see env/shared.env.example); Grafana queries the HTTP API on
# :3200. Blocks and the WAL live in the tempo_data volume, with short
# retention so the volume stays small.
server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# Tempo 3.0 removed the standalone compactor; retention is a scheduler job.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 24h

usage_report:
  reporting_enabled: false
