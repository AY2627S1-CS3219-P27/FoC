services:
  comms-service:
    build:
      context: ..
      dockerfile: comms-service/Dockerfile
      target: development
    image: ${FOC_IMAGE_PREFIX:-foc}/comms-service:${COMMS_SERVICE_IMAGE_TAG:-dev}
    command: npm run start:dev
    restart: unless-stopped
    depends_on:
      comms-db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${COMMS_SERVICE_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: ${COMMS_SERVICE_DB_HOST:-comms-db}
      DB_PORT: ${COMMS_SERVICE_DB_PORT:-5432}
      DB_USERNAME: ${COMMS_SERVICE_DB_USERNAME:-comms_service}
      DB_DATABASE: ${COMMS_SERVICE_DB_DATABASE:-comms_service}
      DB_PASSWORD_FILE: /run/secrets/comms_db_password
      JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public_key_comms_service
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://loki:3100/otlp/v1/logs}
      RABBITMQ_USER: ${COMMS_SERVICE_RABBITMQ_USER:-comms-service}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/foc}
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password_comms_service
      RABBITMQ_PUBSUB_EXCHANGE: ${RABBITMQ_PUBSUB_EXCHANGE:-foc.pubsub}
      RABBITMQ_EVENTS_QUEUE: ${RABBITMQ_EVENTS_QUEUE:-comms-service.events}
      RABBITMQ_RETRY_EXCHANGE: ${RABBITMQ_RETRY_EXCHANGE:-foc.comms.retry}
      RABBITMQ_RETRY_RETURN_EXCHANGE: ${RABBITMQ_RETRY_RETURN_EXCHANGE:-foc.comms.back}
      RABBITMQ_DEAD_LETTER_EXCHANGE: ${RABBITMQ_DEAD_LETTER_EXCHANGE:-foc.comms.dlx}
      RABBITMQ_RETRY_DELAYS_MS: ${RABBITMQ_RETRY_DELAYS_MS:-1000,2000,4000,8000,16000}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_DB_INDEX: ${REDIS_DB_INDEX:-0}
      SOCKET_PATH: ${SOCKET_PATH:-/socket.io}
      SOCKET_ALLOWED_ORIGINS: ${SOCKET_ALLOWED_ORIGINS:-http://localhost:3001}
      SOCKET_TRANSPORT: ${SOCKET_TRANSPORT:-websocket}
      ARCHIVE_POLL_INTERVAL_MS: ${ARCHIVE_POLL_INTERVAL_MS:-5000}
      ARCHIVE_BATCH_SIZE: ${ARCHIVE_BATCH_SIZE:-25}
      ARCHIVE_CLAIM_TTL_MS: ${ARCHIVE_CLAIM_TTL_MS:-60000}
    secrets:
      - comms_db_password
      - rabbitmq_password_comms_service
      - jwt_public_key_comms_service
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider "http://127.0.0.1:$${PORT:-3000}/health/ready"',
        ]
      interval: 10s
      timeout: 3s
      start_period: 120s
      retries: 3
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - dist/
            - coverage/
            - test/
            - .env
            - secrets/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
        - action: sync+restart
          path: ../packages/contracts/src
          target: /usr/src/packages/contracts/src
        - action: sync+restart
          path: ../packages/contracts/tsconfig.json
          target: /usr/src/packages/contracts/tsconfig.json
        - action: sync+restart
          path: ../packages/contracts/tsconfig.build.json
          target: /usr/src/packages/contracts/tsconfig.build.json
        - action: rebuild
          path: ../packages/contracts/package.json
        - action: rebuild
          path: ../packages/contracts/package-lock.json
        - action: sync+restart
          path: ../packages/auth/src
          target: /usr/src/packages/auth/src
        - action: sync+restart
          path: ../packages/auth/tsconfig.json
          target: /usr/src/packages/auth/tsconfig.json
        - action: sync+restart
          path: ../packages/auth/tsconfig.build.json
          target: /usr/src/packages/auth/tsconfig.build.json
        - action: rebuild
          path: ../packages/auth/package.json
        - action: rebuild
          path: ../packages/auth/package-lock.json
        - action: sync+restart
          path: ../packages/observability/src
          target: /usr/src/packages/observability/src
        - action: sync+restart
          path: ../packages/observability/tsconfig.json
          target: /usr/src/packages/observability/tsconfig.json
        - action: sync+restart
          path: ../packages/observability/tsconfig.build.json
          target: /usr/src/packages/observability/tsconfig.build.json
        - action: rebuild
          path: ../packages/observability/package.json
        - action: rebuild
          path: ../packages/observability/package-lock.json

  comms-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${COMMS_SERVICE_DB_USERNAME:-comms_service}
      POSTGRES_DB: ${COMMS_SERVICE_DB_DATABASE:-comms_service}
      POSTGRES_PASSWORD_FILE: /run/secrets/comms_db_password
    volumes:
      - comms-db-data:/var/lib/postgresql
    secrets:
      - comms_db_password
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  comms-db-test:
    image: postgres:18-alpine
    profiles: ['test']
    ports:
      - '127.0.0.1:${COMMS_SERVICE_DB_TEST_HOST_PORT:-5441}:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME:-comms_service}
      POSTGRES_DB: ${DB_DATABASE:-comms_service_test}
      POSTGRES_PASSWORD_FILE: /run/secrets/comms_db_password
    tmpfs:
      - /var/lib/postgresql
    secrets:
      - comms_db_password
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 15

  comms-rabbitmq-test:
    image: rabbitmq:4.3.6-management-alpine
    profiles: ['test']
    ports:
      - '127.0.0.1:${COMMS_RABBITMQ_TEST_HOST_PORT:-5678}:5672'
      - '127.0.0.1:${COMMS_RABBITMQ_TEST_MANAGEMENT_HOST_PORT:-15678}:15672'
    volumes:
      - ../rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  comms-redis-test:
    image: redis:8.6.1-alpine
    profiles: ['test']
    ports:
      - '127.0.0.1:${COMMS_REDIS_TEST_HOST_PORT:-6381}:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  comms-db-data:

secrets:
  comms_db_password:
    file: ./secrets/comms_db_password.secret
  rabbitmq_password_comms_service:
    file: ./secrets/rabbitmq_password.secret
  # User Service owns the signing key pair; Communication Service mounts only
  # the public verification key.
  jwt_public_key_comms_service:
    file: ${COMMS_JWT_PUBLIC_KEY_PATH:-../user-service/secrets/jwt_public_key.secret}
