# Production entry point on port 3001 (compose.prod.yaml). The frontend's standalone server
# doesn't proxy WebSockets, so chat's /socket.io/ goes straight to comms-service; the rest to the frontend.

# Docker's DNS, re-read often so a recreated container's new address is picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3001;
    server_tokens off;
    client_max_body_size 10m;

    # Proxy targets are variables so nginx starts even before the services do.
    set $frontend http://frontend:3000;
    set $comms http://comms-service:3000;

    location /socket.io/ {
        proxy_pass $comms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Chat sockets stay open; comms-service's own pings keep them alive.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Next streams pages; buffering would hold them back.
        proxy_buffering off;
        proxy_read_timeout 5m;
    }
}
