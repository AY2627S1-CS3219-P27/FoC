name: AI PR Review

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  review:
    if: >
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )

    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            gh pr view "${{ github.event.issue.number }}" --json number,baseRefOid,headRefOid \
              --jq '{
                number: .number,
                base_sha: .baseRefOid,
                head_sha: .headRefOid
              }' \
              | jq -r '"number=\(.number)\nbase_sha=\(.base_sha)\nhead_sha=\(.head_sha)"' >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps
        run: pip install requests

      - name: Run review
        env:
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          AGENT_API_URL: ${{ secrets.AGENT_API_URL }}
          AGENT_MODEL: ${{ secrets.AGENT_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: python3 .github/scripts/review.py
