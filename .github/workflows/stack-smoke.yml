name: Stack smoke test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: stack-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Generate throwaway env, secrets and RabbitMQ users
        run: bash scripts/ci-stack-secrets.sh

      - name: Start databases and broker
        run: docker compose up -d --wait rabbitmq credit-db

      - name: Run credit-service migrations
        run: |
          docker compose build credit-service
          docker compose run --rm credit-service npm run migration:run

      - name: Start full stack
        run: docker compose up -d --build --wait

      - name: Show container status
        if: always()
        run: docker compose ps -a

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
