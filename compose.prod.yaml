# Cloud overlay: docker compose -f compose.yaml -f compose.prod.yaml (see scripts/deploy.sh).
# Runs CI-built images from ECR against RDS. ECR_REGISTRY and RDS_HOST come from the
# .env written by scripts/render-env-from-ssm.sh; FOC_IMAGE_TAG comes from scripts/deploy.sh.

x-app: &app
  build: !reset null
  command: !reset null
  restart: unless-stopped
  stop_grace_period: 15s

services:
  user-service:
    <<: *app
    image: ${ECR_REGISTRY:?}/foc/user-service:${FOC_IMAGE_TAG:?}
    depends_on: !override
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  supplier-service:
    <<: *app
    image: ${ECR_REGISTRY:?}/foc/supplier-service:${FOC_IMAGE_TAG:?}
    depends_on: !override
      rabbitmq:
        condition: service_healthy
    environment:
      # supplier-service/compose.yml hardcodes its local database.
      DB_HOST: ${RDS_HOST:?}

  order-service:
    <<: *app
    image: ${ECR_REGISTRY:?}/foc/order-service:${FOC_IMAGE_TAG:?}
    depends_on: !override
      rabbitmq:
        condition: service_healthy

  credit-service:
    <<: *app
    image: ${ECR_REGISTRY:?}/foc/credit-service:${FOC_IMAGE_TAG:?}
    depends_on: !override
      rabbitmq:
        condition: service_healthy

  comms-service:
    <<: *app
    image: ${ECR_REGISTRY:?}/foc/comms-service:${FOC_IMAGE_TAG:?}
    # Must exceed the archive drain deadline (comms-service/README.md).
    stop_grace_period: 75s
    depends_on: !override
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-service:
    <<: *app
    image: ${ECR_REGISTRY:?}/foc/notification-service:${FOC_IMAGE_TAG:?}
    depends_on: !override
      rabbitmq:
        condition: service_healthy

  rag-service:
    <<: *app
    image: ${ECR_REGISTRY:?}/foc/rag-service:${FOC_IMAGE_TAG:?}
    depends_on: !reset null
    environment:
      # rag-service/compose.yml hardcodes its local database.
      DB_HOST: ${RDS_HOST:?}

  email-service:
    <<: *app
    image: ${ECR_REGISTRY:?}/foc/email-service:${FOC_IMAGE_TAG:?}

  frontend:
    <<: *app
    image: ${ECR_REGISTRY:?}/foc/frontend:${FOC_IMAGE_TAG:?}
    # The proxy below takes port 3001.
    ports: !reset []

  # Sends chat's WebSockets to comms-service, which the frontend's standalone server can't proxy.
  proxy:
    image: nginx:1.27-alpine
    networks: [public, internal]
    ports:
      - '3001:3001'
    volumes:
      - ./infra/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      comms-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3001/api/health']
      interval: 10s
      timeout: 3s
      retries: 3

  rabbitmq:
    restart: unless-stopped
    volumes:
      # Same target as compose.yaml, so this replaces the file with dev password hashes.
      - ./rabbitmq/secrets/definitions.prod.secret:/etc/rabbitmq/definitions.json:ro

  redis:
    restart: unless-stopped

  papercut:
    restart: unless-stopped

  grafana:
    environment:
      # Used when Grafana first creates its database; scripts/deploy.sh re-applies it on every deploy.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password

  # Local databases stay off: the services use RDS.
  user-db:
    profiles: [local-db]
  supplier-db:
    profiles: [local-db]
  order-db:
    profiles: [local-db]
  credit-db:
    profiles: [local-db]
  comms-db:
    profiles: [local-db]
  notification-db:
    profiles: [local-db]
  rag-db:
    profiles: [local-db]

secrets:
  grafana_admin_password:
    file: ./observability/secrets/grafana_admin_password.secret
